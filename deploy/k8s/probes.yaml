# Probe configuration for a QVAC Fabric pod, as infrastructure-as-code.
#
# Forked from bkn301-inference's vLLM manifest (docs/QVAC_FORK.md has the full
# disposition). The reasoning is in docs/PROBE_CONTRACT.md; EVERY NUMBER BELOW
# IS AN UNVERIFIED PLACEHOLDER, more so than the vLLM manifest's ever were --
# that one at least started from vLLM's own documented startup behavior before
# PRD §7 Phase 1 replaced its placeholders with a real 153s/45s measurement on
# a rented A10. This manifest has no equivalent measurement yet for QVAC Fabric
# on this hardware. Do not treat anything here as tuned; treat it as a starting
# point for the same measure-then-tighten process, tracked as an explicit
# checklist in docs/QVAC_FORK.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qvac-fabric-inference
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: qvac-fabric
          # PLACEHOLDER. No QVAC Fabric image/tag has been chosen or pinned
          # yet -- unlike vLLM's, which was pinned by tag AND measured against
          # a specific driver/CUDA combination. QVAC Fabric's backend choice
          # (Vulkan vs. CUDA build, on this same A10 hardware) is itself an
          # open question -- see docs/QVAC_FORK.md checklist.
          image: REPLACE_ME/qvac-fabric:UNPINNED
          args:
            # --openai mounts the OpenAI-compatible surface this gateway
            # actually calls (/v1/chat/completions, /v1/models, ...);
            # everything below it is equally unverified against the real
            # server's actual config schema -- see docs/QVAC_FORK.md.
            - --openai
            # Qwen/Qwen3-8B-GGUF, Q4_K_M quant (5.03 GiB) -- same model as
            # bkn301-inference's Qwen/Qwen3-8B-AWQ, re-quantized for QVAC's
            # llama.cpp-descended engine. PRD §3.5 already evaluated this
            # exact HF repo and rejected it FOR VLLM SPECIFICALLY
            # ("experimental" GGUF support there); doesn't apply here, where
            # GGUF is the native format. Q4_K_M mirrors AWQ's INT4 choice
            # (bandwidth-bound decode on an A10 favors smaller weights).
            # Still unpinned: the exact file/revision (docs/QVAC_FORK.md
            # checklist item 5).
            - --model=Qwen/Qwen3-8B-GGUF
            # 8192 to match the PRD's context requirement -- QVAC's own
            # documented default is 1024, which the PRD does not meet. vLLM's
            # equivalent was --max-model-len=8192.
            - --ctx-size=8192
            # UNMEASURED. vLLM ran with NO tensor/data parallelism on this
            # hardware (a single A10 has no NVLink) and instead relied on
            # continuous batching to serve concurrent users off one GPU.
            # QVAC's `config.parallel: N` is a fundamentally different,
            # FCFS-slot concurrency model (docs/QVAC_FORK.md) -- this number
            # is a placeholder, not a considered choice, pending checklist
            # item 3 (real concurrent-slot memory cost on this hardware).
            - --parallel=1
          resources:
            limits:
              # Same hardware class as bkn301-inference (a cluster of cloud
              # A10s) -- only the inference engine changes, not the GPU
              # vendor or the k8s device-plugin resource key.
              #
              # WHETHER "ONE WHOLE GPU, NEVER A FRACTION" STILL APPLIES IS
              # UNVERIFIED. vLLM's version of this rule came from a specific
              # mechanism (KV cache pre-allocated at startup, so a second pod
              # on the same card fails at boot rather than degrading). QVAC's
              # llama.cpp-descended memory model may or may not pre-allocate
              # the same way -- carried forward here as the conservative
              # default, not as a confirmed QVAC property.
              nvidia.com/gpu: 1

          # UNMEASURED. vLLM's 153s cold / 45s warm numbers came from PRD §7
          # Phase 1 actually booting it on a rented A10 -- there is no QVAC
          # Fabric equivalent yet. The multiplier philosophy carries over
          # (roughly 2x whatever the real cold start turns out to be, since a
          # loose startup probe costs a slower failure verdict while a tight
          # one costs a boot loop that never converges), but the base number
          # itself is a guess: nothing here may be tightened until a Phase
          # 1-equivalent QVAC measurement replaces it, the same way vLLM's own
          # placeholder was replaced (docs/QVAC_FORK.md checklist item 1).
          startupProbe:
            httpGet: { path: /v1/models, port: 8000 }
            periodSeconds: 5
            failureThreshold: 60

          # "Is this instance BROKEN" -- deliberately NOT "is it busy".
          # Reasoning carries over unchanged from the vLLM manifest: putting
          # queue depth here pulls every replica out of rotation during a
          # traffic spike, at the exact moment that is most damaging.
          # Load-aware routing belongs in the gateway, which tracks in-flight
          # requests itself. This matters MORE under QVAC's FCFS
          # `config.parallel: N` queueing than it did under vLLM's continuous
          # batching, since "busy" is a more common state with fewer slots.
          #
          # /v1/models, not /health: QVAC Fabric documents no /health endpoint
          # at all (docs/QVAC_FORK.md) -- this is the same OpenAI-shaped path
          # gateway/upstream/client.py's UpstreamPool.health()/.probe() and
          # gateway/upstream/wedge.py's dispatch monitor both already treat as
          # the reachability signal, kept consistent here.
          #
          # UNVERIFIED WHETHER THIS NEEDS AN AUTH HEADER. QVAC requires bearer
          # auth on non-loopback binds by default, and a kubelet httpGet probe
          # very likely counts as non-loopback even within the same pod.
          # httpGet.httpHeaders only accepts a literal string, not a
          # secretKeyRef, so a static probe-scoped token in this manifest is
          # one option; an exec probe reading a mounted Secret is the other.
          # Neither is chosen yet -- see docs/QVAC_FORK.md checklist item 7.
          readinessProbe:
            httpGet: { path: /v1/models, port: 8000 }
            periodSeconds: 10
            failureThreshold: 2

          # Last resort, same reasoning as vLLM's: a restart is expensive
          # (model reload), so this must never be a test generation, and the
          # timeout must tolerate a legitimate decode running long under load.
          # 20s x 3 = ~60s to restart -- carried over as a placeholder, not a
          # QVAC measurement.
          livenessProbe:
            httpGet: { path: /v1/models, port: 8000 }
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
