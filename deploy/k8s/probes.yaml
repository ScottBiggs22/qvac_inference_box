# Probe configuration for a QVAC Fabric pod, as infrastructure-as-code.
#
# Forked from bkn301-inference's vLLM manifest (docs/QVAC_FORK.md has the full
# disposition; the reasoning is in docs/PROBE_CONTRACT.md). As of the
# 2026-10-02 head-to-head (docs/HEAD_TO_HEAD.md), the flags and probe numbers
# below are MEASURED on a rented A10 with the pinned build -- not placeholders.
# What is still unpinned is the image itself (no prebuilt CUDA image exists;
# see `image:`). Re-confirm on the OCI VM.GPU.A10.1 before production, the same
# caveat the vLLM manifest carried.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qvac-fabric-inference
spec:
  replicas: 1
  template:
    spec:
      # QVAC exits 0.63 s after SIGTERM and CUTS in-flight streams (no
      # [DONE]; HEAD_TO_HEAD.md §9) -- unlike vLLM, which drained for 117 s.
      # So the drain has to happen BEFORE the signal: the preStop sleep below
      # holds the pod in Terminating (out of the Service endpoints, so the
      # gateway stops routing to it) long enough for a 512-token answer at the
      # measured 8-user rate (512 / 20 tok/s = ~26 s) to finish.
      terminationGracePeriodSeconds: 45
      containers:
        - name: qvac-fabric
          # STILL A PLACEHOLDER. There is no prebuilt CUDA llama-server for the
          # Tether fork; the measured binary was built from
          # tetherto/qvac-fabric-llm.cpp @ 7bb2161c690befa1bb44ff9b20e4eea2da6c22b8
          # with `cmake -B build -DGGML_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES=86`
          # (CUDA 13.0 nvcc, 3 min on 23 cores). That build is NOT hermetic
          # (it fetches a web-UI bundle) and has NO SSL support -- build with
          # OpenSSL enabled if native TLS is wanted (untested).
          image: REPLACE_ME/qvac-fabric:UNPINNED
          command: ["/app/llama-server"]
          args:
            # Qwen/Qwen3-8B-GGUF @ 7c41481f57cb95916b40956ab2f0b139b296d974,
            # Q4_K_M, sha256 d98cdcbd03e17ce47681435b5150e34c1417f50b5c0019dd560e4882c5745785.
            - -m
            - /models/Qwen3-8B-Q4_K_M.gguf
            # -c is the TOTAL context across slots: 65536 / 8 = 8192 per slot,
            # the PRD's per-request context. 8 slots = 8 concurrent requests;
            # a 9th queues FCFS (measured: no rejection, TTFT grows).
            - -c
            - "65536"
            - -np
            - "8"
            - -ngl
            - "99"
            - -fa
            - "on"
            # REQUIRED. The fork's default host-RAM prompt cache (8 GiB, with
            # --cache-idle-slots) serially copies ~1 GiB of slot KV per arriving
            # request: +2.5 s TTFT at 5 users, +4.4 s at 8, and it degrades
            # once full. -cram 0 removes it with no throughput cost.
            - -cram
            - "0"
            # Do NOT add -kvu: measured 16.7 s / 29 s warm TTFT at 5 / 8 users
            # and half the aggregate throughput.
            - --metrics
            # No --reasoning-format: the default (auto) parses Qwen3's think
            # text into `reasoning_content`, leaving `content` clean. Do NOT set
            # `none`. With it, every json_schema request sent with
            # enable_thinking:false fails HTTP 400 ("Failed to initialize
            # samplers"), and `content` carries an empty <think></think>
            # wrapper (docs/QVAC_FIXES_RESULTS.md). Clients send
            # enable_thinking:false and strip_think as before; under auto the
            # stripper is a no-op.
            - --alias
            - qwen3-8b
            - --api-key
            - $(QVAC_API_KEY)
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            # Never set --log-prompts-dir: it writes prompt text to disk. The
            # default and -v logs were checked with a canary and carry none.
          env:
            - name: QVAC_API_KEY
              valueFrom: { secretKeyRef: { name: qvac-api-key, key: key } }
          resources:
            limits:
              # 14,051 MiB measured at 8 slots x 8192 f16 KV. One whole A10 per
              # pod: 12 slots fit (18,659 MiB), 16 do not with f16 KV.
              nvidia.com/gpu: 1
          lifecycle:
            preStop:
              exec: { command: ["sleep", "30"] }

          # Measured: 1.52-1.61 s to /health warm, 2.96-2.98 s with the weights
          # evicted from page cache; first token +0.14 s. 2 s x 15 = 30 s is
          # ~10x the cold figure -- loose on purpose (a tight startup probe
          # costs a boot loop), but an order of magnitude below vLLM's 300 s.
          startupProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 2
            failureThreshold: 15

          # "Is this instance BROKEN", not "is it busy" (docs/PROBE_CONTRACT.md).
          # /health exists and needs NO auth (measured), so no probe token is
          # needed -- /v1/models and /metrics DO require the API key (401).
          # Under a full 8-user load /health kept answering; it only stops
          # answering when the server's main loop is stuck (SIGSTOP test), which
          # is exactly the "broken" signal wanted.
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2

          # QVAC is a single process: a stuck decode loop hangs /health too
          # (unlike vLLM, whose EngineCore could stall while /health stayed
          # 200). A restart costs ~1.7 s, so liveness can act on the same signal
          # without the vLLM manifest's fear of an expensive reload.
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
